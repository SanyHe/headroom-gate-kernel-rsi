  noise_cv: 0.006958832333790916
  evidence_note: >
    Measured on the AutoDL RTX 6000D (sm_120, 85.6 GB) on 2026-11-15:
    20 alternating pairs, 10 warmup, 3 s clock ramp, CUDA events around one
    launch, 256 MB read flush before every timed repeat. Shipped path median
    0.23498 ms (750 GB/s of ledger traffic); torch.add(a, b) over the identical
    176.16 MB runs in 0.10834 ms (1.626 TB/s). The fused Triton kernel runs in
    0.12205 ms with 100 % bitwise agreement.

mechanism:
  name: one fused silu_and_mul pass over the interleaved gate/up buffer
  class: fusion
  removable_bytes: 0
  removable_ms: 0.12664000317454338
  removable_ms_source: "cases-rtx/swiglu-fusion-b4096-h7168-rtx6000d/evidence/candidate_20261115T144154.json#control_median_ms"
  removable_flops: 0
  addressable_share_claim: 1.0
  justification: >
    torch.add(a, b) moves exactly the fused kernel's bytes with the same
    contiguous access pattern and finishes in 0.10834 ms, so the missing time is
    addressable, not a property of the workload. The fused Triton kernel is
    bit-identical to the shipped path, so the output distribution is unchanged.

