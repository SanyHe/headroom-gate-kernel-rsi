id: verify-fusion-megaspec
title: Fuse the target-verify chain to remove avoidable HBM round trips
status: pre_registered
date: 2026-11-14

# Template — no measurement data is published here. This case must be
# re-measured on third-party cloud hardware before it can produce a verdict.

hypothesis: >
  A persistent megakernel over the 64-layer verify chain removes the
  layer-boundary and intermediate HBM round trips plus the inter-layer sync,
  yielding a measurable speedup on a short-context decode step.

workload:
  kind: decode_step
  shapes: {concurrency: 1, draft_tokens: 8, layers: 64}
  dtype: bf16
  concurrency: 1
  bytes:
    weights: 55098018024
    activations: 492437504   # mandatory state + avoidable intermediates
    output: 1048576
  flops: 0

mechanism:
  name: persistent layer/chain megakernel removing intermediate round trips
  class: persistent
  removable_bytes: 184549376
  removable_flops: 0
  addressable_share_claim: 1.0
  justification: >
    Intermediate activations (GDN, attention, layer-boundary hidden writes)
    are written and re-read per step. The byte ledger caps the claim at the
    avoidable traffic share; the mechanism cannot claim sync/tail residual
    because that is not attributable to the byte ledger.

measurement_plan:
  baseline: "speculative-decode step, c1 short ctx, CUDA graphs on, greedy"
  candidate: "same, with the persistent verify chain"
  repeats: 5
  warmup: 3
  window: "engine-level ITL over a fixed request set"
  clocks: recorded-only

stop_conditions:
  gpu_budget_hours: 0.0
  wall_clock_hours: 0.1
  max_trials: 0

out_of_scope_checks:
  changes_precision: false
  changes_model: false
  changes_acceptance: false
  changes_output_distribution: false
