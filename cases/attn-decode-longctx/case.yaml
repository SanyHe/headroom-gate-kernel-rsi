id: attn-decode-longctx
title: Speed up single-token decode attention at 32k context with a better tiling
status: vetoed
date: 2026-11-14
rules_sha256: "966715a7dfe9df58e71175719fa3f62226d474e368adc42c177fe7d17416bea2"
rules_version: "1.1.0"
re_pinned_note: >
  Re-gated under rules 1.1.0 on 2026-11-14. Nothing about the case changed: the
  same-bytes floor it already recorded (torch.sum over K and V, 0.0614 ms) is
  now an input to the gate instead of a note in the evidence file.

hypothesis: >
  At B=1, 32 query heads, 8 KV heads, head_dim 128 and a 32k cache, one decode
  step streams 128 MiB of K and V. Against the analytic 3.30 TB/s floor
  (0.0407 ms) the measured 0.0636 ms looks like 1.56x of headroom, so a
  tiling/scheduling rewrite of the attention kernel is claimed to recover a
  large part of it.

post_measurement_note: >
  The hypothesis above is the pre-registration and is left unedited. It is
  falsified by the measurement: a trivial kernel that only reads the same
  128 MiB takes 0.0614 ms, i.e. 1.035x of the measured attention latency. The
  apparent 1.56x headroom is an artefact of the 3.30 TB/s copy-bandwidth
  constant, which is unreachable for a read-dominated 128 MiB stream on this
  host (measured read ceiling 2.19 TB/s here).

