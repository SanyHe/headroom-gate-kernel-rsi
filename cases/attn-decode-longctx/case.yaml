id: attn-decode-longctx
title: Speed up single-token decode attention at 32k context with a better tiling
status: pre_registered
date: 2026-11-14

# Template — no measurement data is published here. This case must be
# re-measured on third-party cloud hardware before it can produce a verdict.

hypothesis: >
  At B=1, 32 query heads, 8 KV heads, head_dim 128 and a 32k cache, one decode
  step streams 128 MiB of K and V. A tiling/scheduling rewrite of the attention
  kernel is claimed to recover a large part of the gap to a same-bytes read
  ceiling.

workload:
  kind: attn_decode_step
  shapes: {batch: 1, query_tokens: 1, q_heads: 32, kv_heads: 8, head_dim: 128, ctx: 32768}
  dtype: bf16
  concurrency: 1
  bytes:
    # The 32k KV cache, K and V each read once: 2 * kv_heads * ctx * head_dim * 2.
    activations: 134217728
    weights: 0
    output: 0
  flops: 536870912            # 4 * q_heads * ctx * head_dim

mechanism:
  name: retile the decode attention kernel to stream K/V at the read ceiling
  class: tiling
  removable_bytes: 0
  removable_flops: 0
  addressable_share_claim: 1.0
  justification: >
    Attention reads exactly the bytes a same-bytes reference kernel reads, so
    the only reachable saving is the gap between measured latency and the time
    a same-bytes read takes. No byte can be removed: the KV cache is dense and
    fully consumed.

measurement_plan:
  baseline: "SDPA decode, one 32k KV cache, CUDA events per launch"
  candidate: "same numerics with a retiled / split-kv decode kernel"
  repeats: 20
  warmup: 5
  window: "CUDA-event timing around one launch, L2 flushed between repeats"
  clocks: recorded-only
  sealed_holdout:
    - {ctx: 16384}
    - {ctx: 65536}
    - {ctx: 32768, kv_heads: 4}

stop_conditions:
  gpu_budget_hours: 0.2
  wall_clock_hours: 2.0
  max_trials: 5

out_of_scope_checks:
  changes_precision: false
  changes_model: false
  changes_acceptance: false
  changes_output_distribution: false
