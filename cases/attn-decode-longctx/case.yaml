mechanism:
  name: retile the decode attention kernel to stream K/V at the read ceiling
  class: tiling
  removable_bytes: 0
  removable_ms: 0.002176
  removable_ms_source: "cases/attn-decode-longctx/evidence/baseline_20261114T080655.json#rows[ctx=32768].ceiling_median_ms"
  removable_flops: 0
  addressable_share_claim: 1.0
  justification: >
    Attention reads exactly the bytes the ceiling kernel reads, so the only
    reachable saving is the gap between measured latency and the time a
    same-bytes read takes. That gap is 2.18 us at 32k context, 3.4 % of the
    operator. No byte can be removed: KV cache is dense and fully consumed.

measurement_plan:
  baseline: "SDPA decode, one 32k KV cache, CUDA events per launch"
  candidate: "same numerics with a retiled / split-kv decode kernel"
  repeats: 20
  warmup: 5
  window: "CUDA-event timing around one launch, L2 flushed between repeats"
  clocks: recorded-only
  sealed_holdout:
