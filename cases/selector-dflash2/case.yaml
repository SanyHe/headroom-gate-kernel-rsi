id: selector-dflash2
title: Replace the DFlash2 candidate-lattice path selector with a fused walk
status: vetoed
date: 2026-11-14
rules_sha256: "966715a7dfe9df58e71175719fa3f62226d474e368adc42c177fe7d17416bea2"
rules_version: "1.1.0"
replay_of: "private archive p0-2026-11-13 (not redistributed)"

hypothesis: >
  The selector reads as a hot spot in the draft path, so fusing hidden
  projection + edge scoring + path walk into one kernel yields a measurable
  end-to-end gain on the c1 short-context decode cycle.

workload:
  kind: decode_step
  shapes: {concurrency: 1, draft_tokens: 7, selector_top_k: 16, selector_rank: 256}
  dtype: bf16
  concurrency: 1
  bytes:
    weights: 55098018024     # target 51249200128 + drafter 3848817896
    activations: 307888128   # gdn/attention decode state, not selector-specific
    output: 1048576
  flops: 0
  measured_ms: [22.68]
  measurement_source: "private archive p0-2026-11-13#section-3"
  noise_cv: null

mechanism:
  name: fuse hidden projection + edge scoring + path walk into one selector kernel
  class: fusion
  removable_bytes: 1048576
  removable_ms: 0.110718
  removable_ms_source: "private archive p0-2026-11-13#selector_microbench"
  removable_flops: 0
  addressable_share_claim: 1.0
  justification: >
    The selector is latency-bound, not byte-bound: its entire unfused cost is
    110.7 us/step (hidden proj 14.1 + scoring 82.0 + walk 14.6), so even
    deleting it completely can only save 0.11 ms of a 22.68 ms cycle. The byte
    ledger caps the claim at 0.0003 ms, far below the time accounting, so the
    time accounting binds - and it is 0.49 % of the cycle.

measurement_plan:
  baseline: "speculative-decode step, c1 short ctx, selector in engine (compiled)"
  candidate: "same with the fused selector"
  repeats: 5
  warmup: 3
  window: "engine-level ITL over a fixed request set"
  clocks: recorded-only

stop_conditions:
  gpu_budget_hours: 0.0
  wall_clock_hours: 0.1
  max_trials: 0

out_of_scope_checks:
  changes_precision: false
  changes_model: false
  changes_acceptance: false
  changes_output_distribution: false
