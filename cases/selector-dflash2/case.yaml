id: selector-dflash2
title: Replace the candidate-lattice path selector with a fused walk
status: pre_registered
date: 2026-11-14

# Template — no measurement data is published here. This case must be
# re-measured on third-party cloud hardware before it can produce a verdict.

hypothesis: >
  The selector reads as a hot spot in the draft path, so fusing hidden
  projection + edge scoring + path walk into one kernel yields a measurable
  end-to-end gain on the short-context decode cycle.

workload:
  kind: decode_step
  shapes: {concurrency: 1, draft_tokens: 7, selector_top_k: 16, selector_rank: 256}
  dtype: bf16
  concurrency: 1
  bytes:
    weights: 55098018024
    activations: 307888128
    output: 1048576
  flops: 0

mechanism:
  name: fuse hidden projection + edge scoring + path walk into one selector kernel
  class: fusion
  removable_bytes: 1048576
  removable_flops: 0
  addressable_share_claim: 1.0
  justification: >
    The selector is latency-bound, not byte-bound: its byte-ledger claim is
    capped well below the time accounting, so the time accounting binds. The
    mechanism can only claim what the byte ledger attributes to it.

measurement_plan:
  baseline: "speculative-decode step, c1 short ctx, selector in engine (compiled)"
  candidate: "same with the fused selector"
  repeats: 5
  warmup: 3
  window: "engine-level ITL over a fixed request set"
  clocks: recorded-only

stop_conditions:
  gpu_budget_hours: 0.0
  wall_clock_hours: 0.1
  max_trials: 0

out_of_scope_checks:
  changes_precision: false
  changes_model: false
  changes_acceptance: false
  changes_output_distribution: false
