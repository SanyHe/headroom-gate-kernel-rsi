id: gemv-m8-bf16
title: Rewrite the M=8 BF16 decode GEMV as a bandwidth-shaped streaming kernel
status: inconclusive
date: 2026-11-14
rules_sha256: "966715a7dfe9df58e71175719fa3f62226d474e368adc42c177fe7d17416bea2"
rules_version: "1.1.0"
re_pinned_note: >
  Re-gated under rules 1.1.0 on 2026-11-14. The v1.0.0 verdict (INCONCLUSIVE,
  upper bound [1.289, 1.322]x) stays in ledger.jsonl as history. 1.1.0
  additionally requires a same-bytes reference kernel: reading the same 200 MiB
  takes 0.0803 ms, so the floor rises from the analytic 0.0636 ms to 0.0803 ms
  and the headroom collapses to ~1.03x.

hypothesis: >
  At M=8, K=5120, N=20480 a stock BF16 GEMM reaches only 2.42 TB/s of weight
  streaming (19.3 TFLOPS) because the tiling is shaped for compute-bound M. A
  GEMV/streaming-specialised kernel that reads each weight once at sustained
  copy bandwidth moves the same bytes in 0.064 ms instead of 0.087 ms, i.e. a
  1.37x operator-level speedup with identical numerics.

post_measurement_note: >
  The hypothesis above is the pre-registration and is left unedited. Under a
  stricter protocol (L2-read-flush, 20 repeats) the baseline is 0.0827 ms, not
  0.087 ms, so the predicted upper bound falls from 1.37x to ~1.30x and the case
  does not clear the 1.30x go line with confidence.

