id: gemv-m8-bf16
title: Rewrite the M=8 BF16 decode GEMV as a bandwidth-shaped streaming kernel
status: pre_registered
date: 2026-11-14

# Template — no measurement data is published here. This case must be
# re-measured on third-party cloud hardware before it can produce a verdict.

hypothesis: >
  At M=8, K=5120, N=20480 a stock BF16 GEMM reaches only a fraction of weight
  streaming bandwidth because the tiling is shaped for compute-bound M. A
  GEMV/streaming-specialised kernel that reads each weight once at sustained
  copy bandwidth moves the same bytes faster, i.e. an operator-level speedup
  with identical numerics.

workload:
  kind: gemm
  shapes: {m: 8, k: 5120, n: 20480}
  dtype: bf16
  concurrency: 1
  bytes:
    weights: 209715200        # k*n*2
    activations: 81920        # m*k*2
    output: 327680            # m*n*2
  flops: 1677721600

mechanism:
  name: single-pass streaming GEMV (weights read once, no compute-shaped tile)
  class: tiling
  removable_bytes: 209715200
  removable_flops: 0
  addressable_share_claim: 1.0
  justification: >
    The measured kernel re-streams the weight matrix with a tiling chosen for
    compute-bound shapes; the addressed traffic is the full weight stream,
    whose one-pass streaming time is the floor and therefore the hard cap on
    any claim. Exact numerics: only the accumulation order may change.

measurement_plan:
  baseline: "torch.matmul(a[8,5120], b[5120,20480]) bf16, CUDA graphs irrelevant at op level"
  candidate: "single-kernel streaming GEMV over the same b, same a, same dtype"
  repeats: 10
  warmup: 5
  window: "CUDA-event timing around one launch, L2 flushed between repeats"
  clocks: recorded-only
  sealed_holdout:
    - {m: 4, k: 5120, n: 20480}
    - {m: 16, k: 5120, n: 17408}
    - {m: 8, k: 5120, n: 4096}

stop_conditions:
  gpu_budget_hours: 1.0
  wall_clock_hours: 6.0
  max_trials: 20

out_of_scope_checks:
  changes_precision: false
  changes_model: false
  changes_acceptance: false
  changes_output_distribution: false
