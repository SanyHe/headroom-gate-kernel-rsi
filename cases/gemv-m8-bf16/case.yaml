  class: tiling
  removable_bytes: 209715200
  removable_flops: 0
  addressable_share_claim: 1.0
  justification: >
    The measured kernel re-streams the weight matrix with a tiling chosen for
    compute-bound shapes; the addressed traffic is the full weight stream, whose
    one-pass streaming time at 3.30 TB/s is the floor and therefore the hard cap
    on any claim. Exact numerics: only the accumulation order may change.

