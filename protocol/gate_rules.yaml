# FROZEN — hash-protected. Editing this file invalidates every verdict produced
# under the previous version. Bump `version` and re-pre-register instead.
#
# Every verdict embeds sha256(this file). gate/rules.py refuses to load a file
# whose hash does not match a case's recorded rules_sha256.
version: "1.1.0"
frozen_at: "2026-11-14"

device:
  name: "NVIDIA H20 96GB"
  hbm_spec_tbs: 4.0
  # Conservative sustained copy bandwidth measured on this host
  hbm_realistic_tbs: 3.30
  # Measured BF16 dense GEMM peak on this host.
  bf16_peak_tflops: 138.0
  notes: >
    BW_eff is copy bandwidth, not the 4.0 TB/s spec sheet. FLOP_eff is the full
    measured peak, so compute-bound floors are not flattered. v1.1.0 adds the
    requirement that a green light also cite a same-bytes reference-kernel floor
    (see floor_model), because copy bandwidth is unreachable for read-dominated
    streams below ~300 MB: measured read ceilings there are 0.95-2.57 TB/s while
    the const is 3.30.

decision:
  go_min_speedup: 1.30
  veto_below_speedup: 1.15
  min_headroom_fraction: 0.02
  min_repeats_go: 5
  max_cv_for_go: 0.02
  # Used when n < min_repeats_go: parametric band around the median.
  assumed_cv_single_sample: 0.02
  z90: 1.6448536269514722
  # v1.1.0: an analytic floor may veto, but it may never grant a GO.
  require_empirical_floor_for_go: true

floor_model:
  # A case may declare workload.empirical_floor_ms: the time a trivial kernel
  # needs to move the same bytes, with a named evidence file. The gate uses
  # max(analytic, empirical), so the value can only raise the floor.
  empirical_floor: optional
  applied_as: max(analytic_roofline, empirical_reference_kernel)
  notes: >
    Rationale: for read-dominated operators the analytic floor uses copy
    bandwidth and is therefore too low, which manufactures headroom that does
    not exist. A reference kernel that reads the same buffers is a defensible
    lower bound on any kernel that must move those bytes. Because the floor is
    raised, P1 (predicted >= realised) stays safe by construction.

statistics:
  bootstrap_resamples: 10000
  seed: 20261114
  ci_lower_pct: 5.0
  ci_upper_pct: 95.0

scope:
  # Any `true` in a case's out_of_scope_checks makes the case INVALID.
  forbidden_changes:
    - changes_precision
    - changes_model
    - changes_acceptance
    - changes_output_distribution
  allowed_mechanism_classes:
    - fusion
    - tiling
    - persistent
    - launch-reduction
    - layout

measurement:
  min_samples_for_evidence: 1
  noise_floor_fraction: 0.01
  warmup_default: 10
  notes: >
    Anything below 1 % is "not measurable" on this harness and must not be
    reported as a gain, in either direction.
